<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vinted Web Scanner</title>
<style>
  :root { --teal:#09b1ba; --bg:#f4f6f8; --card:#fff; --text:#222; --muted:#777; }
  * { box-sizing:border-box; }
  body { font-family:system-ui,sans-serif; margin:0; background:var(--bg); color:var(--text); }
  header { background:var(--teal); color:#fff; padding:18px 24px; display:flex; align-items:center; justify-content:space-between; }
  header h1 { margin:0; font-size:1.3rem; }
  .wrap { max-width:1100px; margin:0 auto; padding:20px; }
  .panel { background:var(--card); border-radius:12px; padding:16px; margin-bottom:20px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
  .panel h2 { margin:0 0 12px; font-size:1rem; color:var(--teal); }
  label { display:block; font-size:.8rem; color:var(--muted); margin:8px 0 4px; }
  input, select { width:100%; padding:8px; border:1px solid #ddd; border-radius:8px; font-size:.9rem; }
  .row { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; }
  button { background:var(--teal); color:#fff; border:0; border-radius:8px; padding:10px 18px; font-size:.9rem; cursor:pointer; margin-top:12px; }
  button.secondary { background:#e2e6e9; color:var(--text); }
  button.danger { background:#d9534f; }
  .status { font-size:.85rem; color:var(--muted); margin-top:10px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:16px; }
  .item { background:var(--card); border-radius:12px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,.08); text-decoration:none; color:inherit; display:block; transition:transform .1s; }
  .item:hover { transform:translateY(-2px); }
  .item img { width:100%; aspect-ratio:1; object-fit:cover; background:#eee; display:block; }
  .item .body { padding:10px 12px 14px; }
  .item .title { font-size:.85rem; line-height:1.25; height:2.5em; overflow:hidden; margin:0 0 6px; }
  .item .price { font-weight:700; color:var(--teal); font-size:.95rem; }
  .item .meta { font-size:.75rem; color:var(--muted); margin-top:4px; }
  .badge { display:inline-block; background:#ffe08a; color:#7a5200; font-size:.7rem; font-weight:700; padding:2px 8px; border-radius:99px; margin-bottom:6px; }
  .empty { text-align:center; color:var(--muted); padding:40px 0; }
  .chips span { display:inline-block; background:#eef4f5; border-radius:99px; padding:3px 10px; font-size:.75rem; margin:2px; }
</style>
</head>
<body>
<header>
  <h1>🧵 Vinted Web Scanner</h1>
  <div>
    <span id="autoStatus" style="font-size:.85rem"></span>
    <button class="secondary" style="margin:0 0 0 12px" onclick="toggleAuto()" id="autoBtn"></button>
  </div>
</header>
<div class="wrap">

  <div class="panel">
    <h2>Recherche</h2>
    <div class="row">
      <div>
        <label>Mots-clés (search_text)</label>
        <input id="searchText" placeholder="ex : sac bandoulière">
      </div>
      <div>
        <label>Marque — ID (attribute_ids[brand])</label>
        <input id="brand" placeholder="ex : 417 (Louis Vuitton)">
      </div>
      <div>
        <label>Catégorie — ID (attribute_ids[catalog])</label>
        <input id="catalog" placeholder="ex : 2996">
      </div>
      <div>
        <label>Tri (order)</label>
        <select id="order">
          <option value="newest_first">newest_first</option>
          <option value="relevance">relevance</option>
          <option value="price_low_to_high">price_low_to_high</option>
          <option value="price_high_to_low">price_high_to_low</option>
        </select>
      </div>
      <div>
        <label>Pages par requête</label>
        <input id="pages" type="number" min="1" max="10" value="2">
      </div>
      <div>
        <label>Intervalle auto (secondes)</label>
        <input id="interval" type="number" min="60" step="10" value="300">
      </div>
    </div>
    <div>
      <label>Mots-clés exclus (séparés par des virgules)</label>
      <input id="excluded" placeholder="ex : replica, fake, lot">
    </div>
    <button onclick="saveAndScan()">💾 Enregistrer puis scanner</button>
    <button class="secondary" onclick="saveConfig()">Enregistrer seulement</button>
    <button class="danger" onclick="resetState()">Réinitialiser les vus</button>
    <div class="status" id="status"></div>
  </div>

  <div class="panel">
    <h2>Articles détectés <span class="chips"><span id="itemCount">0</span></span></h2>
    <div id="results" class="grid"></div>
    <div id="emptyMsg" class="empty">Aucun article pour le moment. Lancez un scan ou activez le scan automatique.</div>
  </div>

</div>
<script>
const $ = id => document.getElementById(id);

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

async function loadConfig() {
  const c = await api('/api/config');
  const q = (c.queries && c.queries[0]) || {};
  $('searchText').value = q['search_text'] || '';
  $('brand').value = q['attribute_ids[brand]'] || '';
  $('catalog').value = q['attribute_ids[catalog]'] || '';
  $('order').value = q['order'] || 'newest_first';
  $('pages').value = c.pages || 2;
  $('interval').value = c.interval_seconds || 300;
  $('excluded').value = (c.excluded_keywords || []).join(', ');
  updateAuto(c.auto_running);
}

function buildConfig() {
  return {
    queries: [{
      'search_text': $('searchText').value.trim(),
      'attribute_ids[brand]': $('brand').value.trim(),
      'attribute_ids[catalog]': $('catalog').value.trim(),
      'order': $('order').value,
    }],
    pages: parseInt($('pages').value) || 2,
    interval_seconds: parseInt($('interval').value) || 300,
    excluded_keywords: $('excluded').value.split(',').map(s => s.trim()).filter(Boolean),
  };
}

async function saveConfig() {
  const c = await api('/api/config', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(buildConfig()),
  });
  $('status').textContent = 'Configuration enregistrée ✅';
  updateAuto(c.auto_running);
}

async function saveAndScan() {
  await saveConfig();
  $('status').textContent = 'Scan en cours…';
  try {
    const r = await api('/api/scan', { method: 'POST' });
    $('status').textContent = r.ok
      ? `Scan terminé : ${r.new_items} nouveaux articles`
      : `Erreur : ${r.error}`;
  } catch (e) { $('status').textContent = 'Erreur : ' + e.message; }
  loadItems();
}

async function toggleAuto() {
  const c = await api('/api/config');
  const action = c.auto_running ? 'stop' : 'start';
  const r = await api('/api/auto/' + action, { method: 'POST' });
  updateAuto(r.auto_running);
}

function updateAuto(on) {
  $('autoStatus').textContent = on ? 'Scan auto actif' : 'Scan auto arrêté';
  $('autoBtn').textContent = on ? '⏸ Arrêter le scan auto' : '▶ Démarrer le scan auto';
}

async function resetState() {
  if (!confirm('Vider la liste des articles vus ? Le prochain scan considérera tout comme nouveau.')) return;
  await api('/api/reset', { method: 'POST' });
  loadItems();
}

function esc(s) { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }

async function loadItems() {
  try {
    const r = await api('/api/items');
    $('itemCount').textContent = r.items.length + ' article(s)';
    $('emptyMsg').style.display = r.items.length ? 'none' : 'block';
    $('results').innerHTML = r.items.map((it, i) => `
      <a class="item" href="${esc(it.url)}" target="_blank" rel="noopener">
        ${it.image ? `<img src="${esc(it.image)}" loading="lazy" alt="">` : ''}
        <div class="body">
          ${i < 3 ? '<span class="badge">NOUVEAU</span>' : ''}
          <p class="title">${esc(it.title)}</p>
          <div class="price">${it.price != null ? it.price.toFixed(2).replace('.', ',') : '?'} €
            ${it.total_price != null ? `<span style="font-weight:400;color:#777;font-size:.75rem">(${it.total_price.toFixed(2).replace('.', ',')} € w/fee)</span>` : ''}
          </div>
          <div class="meta">${esc(it.brand)} ${it.size ? '· ' + esc(it.size) : ''} ${it.favourite_count ? '· ❤️ ' + it.favourite_count : ''}</div>
          <div class="meta">${esc(it.found_at)}</div>
        </div>
      </a>`).join('');
  } catch (e) { $('status').textContent = 'Erreur de chargement : ' + e.message; }
}

loadConfig();
loadItems();
setInterval(loadItems, 15000);
</script>
</body>
</html>
